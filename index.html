<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<base href="/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>plonky — Mini-Golf</title>
<script>window.PLONKY_SCAN = false;/* Beta: kein Scan — QR routet direkt hierher. v1 (mit Scan) liegt in "Plonky v1 (mit Scan).html" */</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --accent:#15A35A;
    --accent-ink:#ffffff;
    --paper:#F4F4F1;
    --card:#FFFFFF;
    --ink:#191A15;
    --ink-2:#5C5E55;
    --ink-3:#9A9C92;
    --line:#E7E7E1;
    --line-2:#EFEFEA;
    --bad:#D8533B;
    --r-card:26px;
    --r-btn:18px;
    --font:'Schibsted Grotesk', system-ui, sans-serif;
    --num:'Space Grotesk', 'Schibsted Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#E9E9E4;
    font-family:var(--font);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 90% at 50% -10%, #F2F2EE 0%, #E4E4DF 55%, #DCDCD6 100%);
  }
  /* fill mode (real phone / installed PWA): app fills the screen, thin
     bezel tone shows through the rounded corners */
  html[data-fill="1"] #stage{ background:#DCDCD6; }
  #fit{ transform-origin:center center; }
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:0;height:0;}
  .noscroll{ -ms-overflow-style:none; scrollbar-width:none; }
  .noscroll::-webkit-scrollbar{ display:none; }
  @keyframes plonkPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes scanline{0%{top:6%}100%{top:88%}}
  @keyframes pulseRing{0%{transform:scale(.9);opacity:.55}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
  @keyframes micWave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  @keyframes ballRoll{0%{transform:translateX(-6px) rotate(0)}100%{transform:translateX(6px) rotate(120deg)}}
</style>
</head>
<body>
  <div id="stage"><div id="fit"><div id="root"></div></div></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#15A35A"/>
      <circle cx="50" cy="58" r="13" fill="#fff"/>
      <rect x="47" y="20" width="3.4" height="30" rx="1.5" fill="#fff"/>
      <path d="M50 21 L66 27 L50 33 Z" fill="#fff"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/onboarding.jsx"></script>
  <script type="text/babel" src="src/game.jsx"></script>
  <script type="text/babel" src="src/account.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <script>
    // Real phone / installed PWA → fill the viewport. Desktop → fit the
    // 402x874 phone mockup with letterbox.
    function fitPhone(){
      var fit = document.getElementById('fit');
      if(!fit) return;
      var fill = Math.min(window.innerWidth, window.innerHeight) <= 520
        || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      document.documentElement.dataset.fill = fill ? '1' : '0';
      if(fill){
        fit.style.transform = 'none';
        fit.style.width = '100%';
        fit.style.height = '100%';
        return;
      }
      fit.style.width = '';
      fit.style.height = '';
      var W = 402, H = 874, pad = 24;
      var s = Math.min((window.innerWidth - pad*2)/W, (window.innerHeight - pad*2)/H);
      s = Math.min(s, 1.18);
      fit.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitPhone);
    window.__fitPhone = fitPhone;
    setTimeout(fitPhone, 50);
  </script>
</body>
</html>
